name: PHPStan diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Capture PHPStan output
        run: |
          set +e
          composer analyse > phpstan-output.txt 2>&1
          printf '%s\n' "$?" > phpstan-exit-code.txt
          cat phpstan-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phpstan-diagnostics
          path: |
            phpstan-output.txt
            phpstan-exit-code.txt
